<!doctype html>
<html lang="ar" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Tajawal"; font-weight: 800; font-display: block; src: url("assets/fonts/Tajawal-800-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Tajawal"; font-weight: 800; font-display: block; src: url("assets/fonts/Tajawal-800-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
      /* Concept: from one dot to a Skill. Every shot is built out of the previous one.
         120 BPM (a beat every 0.5 s). Palette: lavender, sky, peach-accent + ink and white. One typeface. */
      :root { --lav: #c9b8ef; --sky: #bfe3f7; --acc: #e8775a; --ink: #2b2540; --white: #fbfaff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--white); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Tajawal", sans-serif; font-weight: 800; color: var(--ink); }
      .abs { position: absolute; }
      #bg { position: absolute; inset: 0; background: var(--white); }
      #dot { left: 480px; top: 820px; width: 120px; height: 120px; border-radius: 60px; background: var(--acc); }
      #sparkG { left: 0; top: 0; width: 1080px; height: 1920px; }
      .bar { position: absolute; left: 240px; top: 863px; width: 600px; height: 34px; border-radius: 17px; }
      #b1 { background: var(--lav); } #b2 { background: var(--acc); } #b3 { background: var(--sky); }
      #card { left: 110px; top: 450px; width: 860px; height: 860px; border-radius: 60px; background: #fff; box-shadow: 0 40px 80px -30px rgba(43,37,64,.35); }
      .kw { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 170px; line-height: 1.1; }
      #kw1 { top: 640px; } #kw2 { top: 830px; color: var(--acc); }
      #kw3, #kw4, #kw5, #kw6 { top: 770px; }
      #title { position: absolute; left: 0; top: 520px; width: 1080px; text-align: center; font-size: 64px; }
      #cnt { position: absolute; left: 0; top: 1212px; width: 1080px; text-align: center; font-size: 46px; color: var(--acc); }
      #cnt .n { display: inline-block; position: relative; width: 120px; height: 60px; vertical-align: top; }
      #cnt .n span { position: absolute; left: 0; top: 0; width: 120px; text-align: center; }
      .cbar { position: absolute; top: 760px; width: 120px; height: 420px; border-radius: 24px 24px 10px 10px; }
      #c1 { left: 215px; background: var(--lav); } #c2 { left: 375px; background: var(--sky); } #c3 { left: 535px; background: var(--acc); } #c4 { left: 695px; background: var(--ink); }
      #base { position: absolute; left: 190px; top: 1186px; width: 700px; height: 8px; border-radius: 4px; background: var(--ink); }
      #cubeWrap { position: absolute; left: 340px; top: 680px; width: 400px; height: 400px; perspective: 1600px; }
      #cube { position: absolute; left: 0; top: 0; width: 400px; height: 400px; transform-style: preserve-3d; }
      .face { position: absolute; left: 0; top: 0; width: 400px; height: 400px; border-radius: 24px; }
      .fF { background: var(--acc); transform: translateZ(200px); }
      .fB { background: var(--ink); transform: rotateY(180deg) translateZ(200px); }
      .fR { background: var(--lav); transform: rotateY(90deg) translateZ(200px); }
      .fL { background: var(--sky); transform: rotateY(-90deg) translateZ(200px); }
      .fT { background: var(--sky); transform: rotateX(90deg) translateZ(200px); }
      .fD { background: var(--lav); transform: rotateX(-90deg) translateZ(200px); }
      #fold { position: absolute; left: 290px; top: 690px; width: 500px; height: 380px; }
      #fTab { position: absolute; left: 30px; top: 0; width: 200px; height: 80px; border-radius: 24px; background: #b39ce6; }
      #fBack { position: absolute; left: 0; top: 40px; width: 500px; height: 340px; border-radius: 30px; background: #b39ce6; }
      #paper { position: absolute; left: 80px; top: 60px; width: 340px; height: 420px; border-radius: 22px; background: #fff; padding: 80px 36px 0; }
      #paper .nm { position: absolute; top: 22px; left: 0; width: 340px; text-align: center; font-size: 34px; color: var(--acc); direction: ltr; }
      #paper i { display: block; height: 16px; border-radius: 8px; background: var(--lav); margin-bottom: 20px; }
      #fFront { position: absolute; left: 0; top: 130px; width: 500px; height: 250px; border-radius: 30px; background: var(--lav); }
      #tile { position: absolute; left: 340px; top: 680px; width: 400px; height: 400px; border-radius: 100px; background: var(--lav); display: flex; align-items: center; justify-content: center; }
      #tile svg { width: 210px; height: 210px; }
      #tileDot { position: absolute; right: 52px; top: 52px; width: 60px; height: 60px; border-radius: 30px; background: var(--acc); }
      #name { position: absolute; left: 0; top: 1140px; width: 1080px; text-align: center; font-size: 76px; direction: ltr; }
      #name span { display: inline-block; }
      #tag { position: absolute; left: 0; top: 1250px; width: 1080px; text-align: center; font-size: 46px; color: #7d7499; }
      #pill { position: absolute; left: 400px; top: 1350px; width: 280px; height: 96px; border-radius: 30px; background: var(--acc); color: #fff; font-size: 46px; text-align: center; line-height: 96px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.2" data-width="1080" data-height="1920">
      <audio id="beat" class="clip" src="assets/beat.wav" data-start="0" data-track-index="20" data-volume="0.85"></audio>
      <div id="bgClip" class="clip" data-start="0" data-duration="15.2" data-track-index="0" style="position:absolute;inset:0"><div id="bg"></div></div>

      <div id="actA" class="clip" data-start="0" data-duration="3.3" data-track-index="1" style="position:absolute;inset:0">
        <div id="dot" class="abs"></div>
        <div id="sparkG" class="abs"><div id="b1" class="bar"></div><div id="b2" class="bar"></div><div id="b3" class="bar"></div></div>
      </div>

      <div id="actB" class="clip" data-start="2.9" data-duration="5.5" data-track-index="2" style="position:absolute;inset:0">
        <div id="card" class="abs"></div>
        <div id="kw1" class="kw">فكرة</div><div id="kw2" class="kw">وحدة</div>
        <div id="kw3" class="kw">كتابة</div><div id="kw4" class="kw">تصميم</div><div id="kw5" class="kw">مونتاج</div><div id="kw6" class="kw">تقارير</div>
        <div id="cnt">مهارات: <span class="n"><span id="n1">1</span><span id="n2">12</span><span id="n3">24</span><span id="n4">48</span></span></div>
        <div id="c1" class="cbar"></div><div id="c2" class="cbar"></div><div id="c3" class="cbar"></div><div id="c4" class="cbar"></div>
        <div id="base"></div>
      </div>

      <div id="actC" class="clip" data-start="8.15" data-duration="2.4" data-track-index="3" style="position:absolute;inset:0">
        <div id="cubeWrap"><div id="cube"><div class="face fB"></div><div class="face fL"></div><div class="face fR"></div><div class="face fT"></div><div class="face fD"></div><div class="face fF"></div></div></div>
      </div>

      <div id="actD" class="clip" data-start="10.2" data-duration="2.4" data-track-index="4" style="position:absolute;inset:0">
        <div id="fold"><div id="fTab"></div><div id="fBack"></div>
          <div id="paper"><div class="nm">SKILL.md</div><i id="p1"></i><i id="p2" style="width:80%;background:var(--sky)"></i><i id="p3" style="width:90%"></i><i id="p4" style="width:60%;background:var(--acc)"></i></div>
          <div id="fFront"></div></div>
      </div>

      <div id="actE" class="clip" data-start="12.1" data-duration="3.1" data-track-index="5" style="position:absolute;inset:0">
        <div id="tile"><svg viewBox="0 0 100 100"><g fill="#2b2540"><rect x="45" y="6" width="10" height="88" rx="5"/><rect x="45" y="6" width="10" height="88" rx="5" transform="rotate(60 50 50)"/><rect x="45" y="6" width="10" height="88" rx="5" transform="rotate(120 50 50)"/></g></svg><div id="tileDot"></div></div>
        <div id="name"><span>a</span><span>y</span><span>m</span><span>e</span><span>n</span><span>.</span><span>a</span><span>i</span><span>.</span><span>l</span><span>a</span><span>b</span></div>
        <div id="tag">Claude بالعربي، بطريقة عملية</div>
        <div id="pill">تابع</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const B = n => n * 0.5; // beat -> seconds (120 BPM)

      // ---- A: dot -> bar -> three bars -> six-armed spark (beats 0-5) ----
      tl.fromTo("#dot", { scale: 0 }, { scale: 1, duration: .3, ease: "back.out(3)" }, B(0));
      tl.to("#dot", { scaleX: 1.25, scaleY: .75, y: 20, duration: .1, yoyo: true, repeat: 1, ease: "power2.out" }, B(1));
      tl.to("#dot", { scaleX: 5, scaleY: .283, duration: .28, ease: "expo.out" }, B(2));
      tl.set("#sparkG", { opacity: 0 }, 0);
      tl.set("#sparkG", { opacity: 1 }, B(3));
      tl.set("#dot", { opacity: 0 }, B(3));
      tl.fromTo("#b1", { y: 0 }, { y: -70, duration: .25, ease: "expo.out" }, B(3));
      tl.fromTo("#b3", { y: 0 }, { y: 70, duration: .25, ease: "expo.out" }, B(3));
      [["#b1", 0], ["#b2", 60], ["#b3", 120]].forEach(([s, r]) => tl.to(s, { y: 0, rotation: r, scaleX: .5, duration: .32, ease: "back.out(1.6)" }, B(4)));
      tl.fromTo("#sparkG", { rotation: 0, transformOrigin: "540px 880px" }, { rotation: 180, duration: .42, ease: "expo.inOut" }, B(5));
      tl.to("#sparkG", { scale: 3.4, opacity: 0, duration: .25, ease: "power3.in" }, B(6) - .2);

      // ---- B: the spark opens into a card; kinetic type on every beat (beats 6-11) ----
      tl.fromTo("#card", { scale: .05, rotation: -12 }, { scale: 1, rotation: 0, duration: .38, ease: "expo.out" }, B(6));
      tl.fromTo("#kw1", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: .22, ease: "power4.out" }, B(6));
      tl.fromTo("#kw2", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: .22, ease: "power4.out" }, B(7));
      tl.to(["#kw1", "#kw2"], { y: -140, clipPath: "inset(0 0 100% 0)", duration: .14, ease: "power3.in" }, B(8) - .16);
      const words = ["#kw3", "#kw4", "#kw5", "#kw6"], cards = ["#bfe3f7", "#c9b8ef", "#e8775a", "#ffffff"];
      tl.set(words, { clipPath: "inset(0 0 0 100%)" }, 0);
      words.forEach((w, i) => {
        const t = B(8 + i), from = i % 2 ? "inset(0 100% 0 0)" : "inset(0 0 0 100%)";
        tl.to("#card", { backgroundColor: cards[i], duration: .12, ease: "none" }, t);
        tl.fromTo(w, { clipPath: from, x: i % 2 ? -120 : 120, color: i === 2 ? "#fbfaff" : "#2b2540" }, { clipPath: "inset(0 0% 0 0%)", x: 0, duration: .18, ease: "expo.out" }, t);
        if (i < 3) tl.to(w, { clipPath: i % 2 ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)", x: i % 2 ? 120 : -120, duration: .15, ease: "power3.in" }, t + .4);
      });
      // "تقارير" becomes the chart title; bars grow on the beat, the skill counter ticks (beats 12-15)
      tl.to("#kw6", { scale: .38, y: -250, duration: .3, ease: "expo.inOut" }, B(12) - .1);
      tl.set(["#cnt", "#base"], { opacity: 0 }, 0);
      tl.fromTo("#base", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: .25, ease: "expo.out" }, B(12));
      tl.set(["#n2", "#n3", "#n4"], { opacity: 0 }, 0);
      tl.fromTo("#cnt", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .2 }, B(12));
      const hs = [.38, .62, .84, 1];
      ["#c1", "#c2", "#c3", "#c4"].forEach((c, i) => {
        tl.fromTo(c, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: hs[i], duration: .3, ease: "back.out(2.2)" }, B(12 + i));
        if (i > 0) {
          tl.to("#n" + i, { y: -40, opacity: 0, duration: .12 }, B(12 + i));
          tl.fromTo("#n" + (i + 1), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .16 }, B(12 + i) + .05);
        }
      });
      // the chart collapses into a square that becomes the cube's front face (beat 16)
      tl.to(["#c1", "#c2", "#c3", "#c4"], { x: (i) => [325, 165, 5, -155][i], scaleY: 0, duration: .25, ease: "power3.in" }, B(16) - .15);
      tl.to(["#kw6", "#cnt", "#base"], { scale: 0, opacity: 0, duration: .2, ease: "power3.in" }, B(16) - .15);
      tl.to("#card", { scale: .465, borderRadius: "52px", backgroundColor: "#e8775a", duration: .3, ease: "expo.inOut" }, B(16) - .2);

      // ---- C: 2D -> 3D cube, turning on the beat (beats 16-20) ----
      tl.set("#card", { opacity: 0 }, 8.15);
      tl.fromTo("#cube", { rotationX: 0, rotationY: 0 }, { rotationX: -28, rotationY: 45, duration: .45, ease: "expo.out" }, 8.15);
      tl.to("#cube", { rotationY: 135, duration: .3, ease: "expo.inOut" }, B(18));
      tl.to("#cube", { rotationY: 225, rotationX: -40, duration: .3, ease: "expo.inOut" }, B(19));
      tl.to("#cube", { rotationY: 360, rotationX: 0, duration: .35, ease: "expo.inOut" }, B(20) - .15);
      tl.to(".fF", { backgroundColor: "#c9b8ef", duration: .2 }, B(20) - .1);

      // ---- D: the flat face becomes a folder; SKILL.md rises (beats 20-24) ----
      tl.set("#actC", { opacity: 0 }, 10.25);
      tl.fromTo("#fold", { scaleX: .8, scaleY: 1.05 }, { scaleX: 1, scaleY: 1, duration: .3, ease: "back.out(2)" }, 10.2);
      tl.set("#paper", { y: 120, opacity: 0 }, 0);
      tl.set("#paper", { opacity: 1 }, B(21));
      tl.fromTo("#fFront", { rotationX: 0, transformOrigin: "50% 100%", transformPerspective: 900 }, { rotationX: -55, duration: .3, ease: "power3.out" }, B(21));
      tl.to("#paper", { y: -230, duration: .38, ease: "back.out(1.5)" }, B(21));
      ["#p1", "#p2", "#p3", "#p4"].forEach((p, i) => tl.fromTo(p, { scaleX: 0, transformOrigin: "right center" }, { scaleX: 1, duration: .2, ease: "expo.out" }, B(22) + i * .25));

      // ---- E: the page folds into the logo; end title (beats 24-30) ----
      tl.to(["#fTab", "#fBack", "#fFront"], { y: 260, opacity: 0, duration: .3, ease: "power3.in" }, B(24) - .1);
      tl.to("#paper", { y: -80, scaleX: 400 / 340, scaleY: 400 / 420, borderRadius: "100px", backgroundColor: "#c9b8ef", duration: .3, ease: "expo.inOut" }, B(24) - .1);
      tl.set("#actD", { opacity: 0 }, 12.2);
      tl.fromTo("#tile svg", { rotation: -60, scale: .4 }, { rotation: 0, scale: 1, duration: .4, ease: "back.out(2)" }, 12.2);
      tl.fromTo("#tileDot", { scale: 0 }, { scale: 1, duration: .25, ease: "back.out(3)" }, B(25));
      tl.fromTo("#name span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .25, ease: "back.out(2)", stagger: .025 }, B(25));
      tl.fromTo("#tag", { y: 30, clipPath: "inset(0 0 100% 0)" }, { y: 0, clipPath: "inset(0 0 0% 0)", duration: .3, ease: "expo.out" }, B(26));
      tl.fromTo("#pill", { scale: 0 }, { scale: 1, duration: .3, ease: "back.out(2.6)" }, B(27));
      tl.to("#tile svg", { rotation: 60, duration: .3, ease: "expo.inOut" }, B(28));
      tl.to("#tile", { scale: 1.06, duration: .12, yoyo: true, repeat: 1, ease: "power2.out" }, B(29));
      tl.to("#pill", { scale: 1.08, duration: .12, yoyo: true, repeat: 1, ease: "power2.out" }, B(29));

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
